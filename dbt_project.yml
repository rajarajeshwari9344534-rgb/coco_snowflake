name: 'healthcare'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  healthcare:
    staging:
      +materialized: view
    transformation:
      +materialized: view
    dimensions:
      +materialized: table
    facts:
      +materialized: table
    analytics:
      +materialized: view
